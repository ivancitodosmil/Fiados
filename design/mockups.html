<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fiados · Propuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2F6D5F; --verde-claro:#9FD3C5; --tinta:#18282A; --coral:#E8836B; --papel:#F4F8F6; --blanco:#fff;
  --gris:#5B6B6C; --borde:#E3EAE7;
  --ok:#1E9E6A; --ok-bg:#E3F5EC; --warn:#B57F00; --warn-bg:#FFF4D6; --bad:#D64545; --bad-bg:#FDE7E7;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,system-ui,sans-serif;color:var(--tinta);background:#DDE6E2;-webkit-font-smoothing:antialiased}
.h{font-family:Poppins,sans-serif;font-weight:600;letter-spacing:-.01em}
.num{font-family:Poppins,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--gris)}
/* ---------- stage ---------- */
.stage{width:1400px;height:940px;padding:44px 56px;display:flex;flex-direction:column;gap:26px}
.stage-head{display:flex;align-items:baseline;gap:18px}
.stage-head .tag{font:600 13px Geist;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);background:#fff;padding:6px 12px;border-radius:99px}
.stage-head h1{font:600 30px Poppins}
.stage-head p{color:var(--gris);font-size:16px}
.phones{display:flex;gap:44px;justify-content:center}
.phone{width:390px;height:780px;border-radius:46px;background:var(--papel);overflow:hidden;position:relative;
  box-shadow:0 0 0 10px #10191A,0 30px 60px -20px rgba(16,25,26,.45)}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:600 14px Geist}
.scr{padding:4px 20px 0;height:calc(100% - 44px - 78px);overflow:hidden}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid var(--borde);display:flex;justify-content:space-around;padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--gris);font-weight:500}
.tab i{width:24px;height:24px;border-radius:7px;background:currentColor;opacity:.35;display:block}
.tab.on{color:var(--verde)} .tab.on i{opacity:1}
/* ---------- common ---------- */
.card{background:#fff;border-radius:var(--r);padding:16px;border:1px solid var(--borde)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-warn{color:var(--warn);background:var(--warn-bg)} .p-bad{color:var(--bad);background:var(--bad-bg)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:600 15px Poppins;background:var(--verde-claro);color:var(--verde);flex:none}
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px Geist;border:0}
.btn-p{background:var(--verde);color:#fff}
.btn-s{background:#fff;color:var(--tinta);border:1px solid var(--borde)}
.wa{width:40px;height:40px;border-radius:12px;background:#E7F6EE;display:grid;place-items:center;flex:none}
.wa svg,.btn svg{width:20px;height:20px;flex:none}
.list .item{padding:12px 0;border-bottom:1px solid var(--borde)} .list .item:last-child{border:0}
.sec{font:600 13px Geist;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 10px}
.field{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 14px}
.field label{font-size:12px;color:var(--gris);display:block;margin-bottom:2px}
.field div{font-size:16px;font-weight:500}
.seg{display:flex;background:#E9F0ED;border-radius:12px;padding:4px;gap:4px}
.seg span{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--gris)}
.seg span.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{padding:7px 12px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--borde);background:#fff}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.bar{height:8px;border-radius:99px;background:#E9F0ED;overflow:hidden} .bar b{display:block;height:100%;background:var(--verde);border-radius:99px}
/* ---------- web ---------- */
.web{width:1400px;height:940px;padding:36px 56px}
.browser{width:100%;height:100%;border-radius:16px;overflow:hidden;background:var(--papel);box-shadow:0 30px 60px -24px rgba(16,25,26,.4);display:flex;flex-direction:column}
.chrome{height:40px;background:#fff;border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:8px;padding:0 16px}
.chrome i{width:11px;height:11px;border-radius:50%;background:#E3EAE7;display:block}
.chrome .url{margin-left:20px;background:var(--papel);border-radius:8px;padding:5px 14px;font-size:12px;color:var(--gris);width:420px}
.app{flex:1;display:flex;min-height:0}
.side{width:236px;background:#fff;border-right:1px solid var(--borde);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.side .nav{padding:11px 12px;border-radius:12px;font-weight:500;color:var(--gris);display:flex;gap:10px;align-items:center}
.side .nav i{width:18px;height:18px;border-radius:5px;background:currentColor;opacity:.4}
.side .nav.on{background:var(--papel);color:var(--verde)} .side .nav.on i{opacity:1}
.main{flex:1;padding:28px 34px;overflow:hidden}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--borde)}
td{padding:13px 14px;border-bottom:1px solid var(--borde)}
tr:last-child td{border:0}
.logo-fiados{display:flex;align-items:center;gap:10px}
.logo-fiados .mark{width:34px;height:34px;border-radius:10px;background:var(--verde);display:grid;place-items:center;color:#fff;font:700 18px Poppins;position:relative}
.logo-fiados .mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.logo-fiados b{font:600 20px Poppins}
.por{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gris)} .por img{height:14px}

/* ================= DIRECTION A · Claro sereno ================= */
.A .hero{background:var(--tinta);color:#fff;border-radius:22px;padding:20px}
.A .hero .lbl{color:var(--verde-claro);font-size:13px;font-weight:500}
/* ================= DIRECTION B · Banda verde ================= */
.B .phone{background:var(--papel)}
.B .band{background:var(--verde);color:#fff;margin:-4px -20px 0;padding:14px 20px 70px;border-radius:0 0 30px 30px}
.B .phone.green .status{background:var(--verde)}
.B .band .mark{background:#fff;color:var(--verde)}
.B .band .por{color:rgba(255,255,255,.75)}
.B .status{position:relative;z-index:2}
.B .phone.green .status{color:#fff}
.B .lift{margin-top:-54px}
.B .btn-p{background:var(--tinta)}
.B .tab.on{color:var(--tinta)}
.B .chip.on{background:var(--verde);border-color:var(--verde)}
.B .av{background:#E9F0ED;color:var(--tinta)}
/* ================= DIRECTION C · Tarjetas suaves ================= */
.C{--r:24px}
.C .card{border:0;box-shadow:0 1px 2px rgba(24,40,42,.05),0 6px 20px -8px rgba(24,40,42,.12)}
.C .phone{background:#fff}
.C .soft{background:#E6F3EF;border-radius:24px;padding:20px}
.C .av{border-radius:50%;background:var(--tinta);color:#fff}
.C .btn{border-radius:99px}
.C .tabbar{border:0;box-shadow:0 -6px 20px -10px rgba(24,40,42,.18)}
.C .pill{font-size:11px}
.C .accent{color:var(--coral)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const D = P.get('d') || 'A', VIEW = P.get('v') || 'mobile';
const WA = '<svg viewBox="0 0 24 24" fill="#1E9E6A"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>';
const clientes = [
  ['María Andrade','MA',182.40,'p-bad','Vencido · 17 días'],
  ['Juan Pérez','JP',225.00,'p-bad','Vencido · 9 días'],
  ['Rosa Villacís','RV',64.00,'p-warn','Vence en 2 días'],
  ['Carlos Mena','CM',40.50,'p-ok','Al día'],
  ['Lucía Torres','LT',120.00,'p-ok','Al día'],
];
const money = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2});
const status = (dark) => `<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
const tabs = (on) => `<div class="tabbar">${['Inicio','Clientes','Cobros','Ajustes'].map((t,i)=>`<div class="tab ${i===on?'on':''}"><i></i>${t}</div>`).join('')}</div>`;
const logo = `<div class="logo-fiados"><div class="mark">F</div><div><b>Fiados</b><div class="por">por <img src="../brand/logo-horizontal-color-recorte.png"></div></div></div>`;
const logoW = logo.replace('logo-horizontal-color','logo-horizontal-blanco').replace('<b>','<b style="color:#fff">');

function row(c, wa=true){
  return `<div class="item row"><div class="av">${c[1]}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${c[0]}</div><div style="margin-top:4px"><span class="pill ${c[3]}">${c[4]}</span></div></div><div style="text-align:right"><div class="num" style="font-size:17px">${money(c[2])}</div></div>${wa?`<div class="wa">${WA}</div>`:''}</div>`;
}
/* ---------------- phone screens per direction ---------------- */
function dash(){
  if(D==='A') return `<div class="phone">${status()}<div class="scr">
    <div class="between" style="margin:6px 0 16px">${logo}<div class="av" style="width:38px;height:38px">DP</div></div>
    <div class="hero"><div class="lbl">Por cobrar</div><div class="num" style="font-size:40px;margin:4px 0 12px">$2,418.90</div>
      <div class="row" style="gap:10px"><span class="pill" style="background:rgba(214,69,69,.18);color:#FF8C8C">Vencido $486.20</span><span class="pill" style="background:rgba(159,211,197,.16);color:var(--verde-claro)">Cobrado nov. $930</span></div></div>
    <div class="row" style="gap:10px;margin-top:12px"><div class="card" style="flex:1"><div class="num" style="font-size:26px;color:var(--bad)">7</div><div class="muted" style="font-size:13px">clientes vencidos</div></div><div class="card" style="flex:1"><div class="num" style="font-size:26px;color:var(--warn)">4</div><div class="muted" style="font-size:13px">por vencer</div></div></div>
    <div class="sec">Requieren atención</div><div class="card list" style="padding:4px 14px">${clientes.slice(0,4).map(c=>row(c)).join('')}</div>
  </div>${tabs(0)}</div>`;
  if(D==='B') return `<div class="phone green">${status()}<div class="scr">
    <div class="band"><div class="between" style="margin-bottom:22px">${logoW}<div class="av" style="width:38px;height:38px;background:rgba(255,255,255,.16);color:#fff">DP</div></div>
      <div style="opacity:.8;font-size:14px">Por cobrar</div><div class="num" style="font-size:44px">$2,418.90</div></div>
    <div class="card lift" style="display:grid;grid-template-columns:1fr 1fr 1fr;padding:14px 6px;text-align:center">
      <div><div class="num" style="font-size:19px;color:var(--bad)">$486</div><div class="muted" style="font-size:12px">Vencido</div></div>
      <div style="border-left:1px solid var(--borde);border-right:1px solid var(--borde)"><div class="num" style="font-size:19px;color:var(--warn)">$212</div><div class="muted" style="font-size:12px">Por vencer</div></div>
      <div><div class="num" style="font-size:19px;color:var(--ok)">$930</div><div class="muted" style="font-size:12px">Cobrado nov.</div></div></div>
    <div class="between" style="margin:18px 2px 8px"><div class="h" style="font-size:17px">Requieren atención</div><span style="color:var(--verde);font-weight:600;font-size:14px">Ver todos</span></div>
    <div class="list">${clientes.slice(0,4).map(c=>`<div class="card" style="margin-bottom:8px;padding:2px 14px">${row(c)}</div>`).join('')}</div>
  </div>${tabs(0)}</div>`;
  return `<div class="phone">${status()}<div class="scr">
    <div class="between" style="margin:6px 0 16px"><div><div class="muted" style="font-size:14px">Hola, Don Pepe 👋</div><div class="h" style="font-size:22px">Tienda Don Pepe</div></div><div class="av">DP</div></div>
    <div class="soft"><div class="between"><div class="muted" style="font-size:14px;font-weight:500">Por cobrar</div><span class="pill p-bad">7 vencidos</span></div>
      <div class="num" style="font-size:42px;margin:6px 0 14px">$2,418<span style="font-size:26px;color:var(--gris)">.90</span></div>
      <div class="bar"><b style="width:28%;background:var(--bad)"></b></div><div class="between" style="font-size:13px;margin-top:8px"><span style="color:var(--bad);font-weight:600">$486.20 vencido</span><span class="muted">$930 cobrado nov.</span></div></div>
    <div class="row" style="gap:10px;margin-top:14px"><div class="btn btn-p" style="flex:1;height:48px">+ Nuevo fiado</div><div class="btn btn-s" style="flex:1;height:48px">Registrar pago</div></div>
    <div class="sec" style="text-transform:none;letter-spacing:0;font-size:17px;color:var(--tinta);font-family:Poppins">Requieren atención</div>
    <div class="card list" style="padding:2px 14px">${clientes.slice(0,3).map(c=>row(c)).join('')}</div>
  </div>${tabs(0)}</div>`;
}
function detalle(){
  const cuotas=[['1','8 dic','$30.00','p-ok','Pagada'],['2','15 dic','$30.00','p-bad','Vencida · 7 d'],['3','22 dic','$30.00','p-warn','Vence en 2 d'],['4','29 dic','$30.00','p-ok','Pendiente']];
  const cl = cuotas.map(q=>`<div class="item between"><div class="row" style="gap:10px"><div class="num" style="width:26px;height:26px;border-radius:8px;background:var(--papel);display:grid;place-items:center;font-size:13px">${q[0]}</div><div><div style="font-weight:500">${q[2]}</div><div class="muted" style="font-size:12px">Vence ${q[1]}</div></div></div><span class="pill ${q[3]}">${q[4]}</span></div>`).join('');
  const head = D==='B'
   ? `<div class="band" style="padding-bottom:66px"><div class="between" style="margin-bottom:14px"><span style="font-size:22px">←</span><span style="font-size:14px;opacity:.85">Editar</span></div><div class="row"><div class="av" style="background:rgba(255,255,255,.16);color:#fff">JP</div><div><div class="h" style="font-size:20px">Juan Pérez</div><div style="opacity:.8;font-size:13px">CI 1712345678 · 099 123 4567</div></div></div></div>
      <div class="card lift"><div class="between"><div><div class="muted" style="font-size:13px">Debe en total</div><div class="num" style="font-size:34px">$225.00</div></div><span class="pill p-bad">9 días de mora</span></div></div>`
   : `<div class="between" style="margin:4px 0 14px"><span style="font-size:22px">←</span><span style="color:var(--verde);font-weight:600">Editar</span></div>
      <div class="row" style="margin-bottom:14px"><div class="av">JP</div><div><div class="h" style="font-size:20px">Juan Pérez</div><div class="muted" style="font-size:13px">CI 1712345678 · 099 123 4567</div></div></div>
      <div class="${D==='C'?'soft':'card'}" ${D==='A'?'style="border-left:4px solid var(--bad)"':''}><div class="between"><div><div class="muted" style="font-size:13px">Debe en total</div><div class="num" style="font-size:36px">$225.00</div></div><span class="pill p-bad">9 días de mora</span></div>
      <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><span class="chip">Ropa $75</span><span class="chip">General $150</span></div></div>`;
  return `<div class="phone ${D==='B'?'green':''}">${status()}<div class="scr">${head}
    <div class="row" style="gap:8px;margin-top:12px"><div class="btn btn-p" style="flex:1.3;height:48px">${WA.replace('#1E9E6A','#fff')} Recordar</div><div class="btn btn-s" style="flex:1;height:48px">Pago</div><div class="btn btn-s" style="width:52px;height:48px;font-size:13px">QR</div></div>
    <div class="sec">Chompa · Ropa · 20% interés</div>
    <div class="card list" style="padding:2px 14px">${cl}</div>
  </div>${tabs(1)}</div>`;
}
function nuevo(){
  const prev = `<div class="${D==='C'?'soft':'card'}" style="${D==='A'?'background:var(--papel);border-style:dashed':''}">
      <div class="between" style="font-size:14px"><span class="muted">Capital</span><span class="num" style="font-size:15px">$100.00</span></div>
      <div class="between" style="font-size:14px;margin:6px 0"><span class="muted">+ Interés 20%</span><span class="num" style="font-size:15px">$20.00</span></div>
      <div class="between" style="border-top:1px solid var(--borde);padding-top:8px"><span style="font-weight:600">Total</span><span class="num" style="font-size:22px;color:var(--verde)">$120.00</span></div>
      <div style="margin-top:10px;font-weight:600">4 cuotas de <span class="num">$30.00</span></div>
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${['8 dic','15 dic','22 dic','29 dic'].map(f=>`<span class="chip" style="font-size:12px;padding:5px 10px">${f}</span>`).join('')}</div></div>`;
  return `<div class="phone">${status()}<div class="scr">
    <div class="between" style="margin:4px 0 12px"><span style="font-size:15px;color:var(--gris)">Cancelar</span><span class="h" style="font-size:17px">Nuevo fiado</span><span style="width:50px"></span></div>
    <div class="muted" style="font-size:13px;text-align:center">Monto fiado a Juan Pérez</div>
    <div class="num" style="font-size:46px;text-align:center;margin:2px 0 12px">$100<span style="color:var(--gris)">.00</span></div>
    <div class="row" style="gap:8px;margin-bottom:10px"><span class="chip on">Ropa · 20%</span><span class="chip">General</span><span class="chip">Víveres</span></div>
    <div class="seg" style="margin-bottom:10px"><span>Pago único</span><span class="on">Por fechas</span><span>N° cuotas</span></div>
    <div class="row" style="gap:8px;margin-bottom:10px"><div class="field" style="flex:1"><label>Inicio</label><div>01/12/2026</div></div><div class="field" style="flex:1"><label>Fin</label><div>29/12/2026</div></div></div>
    <div class="seg" style="margin-bottom:12px"><span>Diario</span><span class="on">Semanal</span><span>Quincenal</span><span>Mensual</span></div>
    ${prev}
    <div class="btn btn-p" style="margin-top:12px">Guardar fiado</div>
  </div></div>`;
}
/* ---------------- web ---------------- */
function web(){
  const kpiHero = D==='B' ? 'background:var(--verde);color:#fff;border:0' : D==='A' ? 'background:var(--tinta);color:#fff;border:0' : 'background:#E6F3EF;border:0';
  const lblHero = D==='C' ? 'var(--gris)' : 'rgba(255,255,255,.75)';
  return `<div class="web"><div class="browser"><div class="chrome"><i></i><i></i><i></i><div class="url">app.fiados.ec/inicio</div></div>
  <div class="app"><div class="side">${logo}<div style="height:22px"></div>
    ${['Inicio','Clientes','Cobros','Apartados','Ajustes'].map((t,i)=>`<div class="nav ${i===0?'on':''}"><i></i>${t}</div>`).join('')}
    <div style="flex:1"></div><div class="card" style="background:var(--papel);border:0"><div style="font-weight:600;font-size:14px">Tienda Don Pepe</div><div class="muted" style="font-size:12px">dueño · Plan Predir</div></div></div>
  <div class="main">
    <div class="between" style="margin-bottom:22px"><div><div class="muted">Domingo, 22 de noviembre</div><div class="h" style="font-size:28px">Inicio</div></div>
      <div class="row" style="gap:10px"><div class="field" style="width:300px;padding:12px 14px;color:var(--gris)">Buscar cliente o cédula…</div><div class="btn btn-s" style="padding:0 18px">Registrar pago</div><div class="btn btn-p" style="padding:0 20px">+ Nuevo fiado</div></div></div>
    <div class="kpis">
